<div class="mainstyle">

    <form class="form-container">
        <div>
           <label class="mainlabel">Add services:</label> 
        </div>
        <div class="form-group">
            <label for="name">Your Name: </label>
            <input type="text" [(ngModel)]="name" name="name" id="name" placeholder="Enter your Name: ">
        </div>
        <div class="form-group">
            <label for="email">E-mail: </label>
            <input type="email" [(ngModel)]="email" name="email" id="email" placeholder="Enter your email: ">
        </div>
        <div class="form-group">
            <label for="servicename">Service Name: </label>
            <input type="text" [(ngModel)]="servicename" name="servicename" id="servicename" placeholder="Enter your Service Name: ">
        </div>

        <div class="form-group">
            <label for="cost">Cost</label>
            <input type="number" [(ngModel)]="cost" name="cost" id="cost">
        </div>
        <div class="form-group">
            <label for="duedate">Due Date:</label>
            <input type="date"  [(ngModel)]="duedate" name="duedate" id="date">
        </div>
        <div class="form-group">
            <label for="type">Type</label>
            <select id="type"  [(ngModel)]="type" name="type">
                <option value="Basic">Basic</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Auto">Auto</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="button-group">
            <button type="button" class="btn btn-primary" (click)="addService()">Add Service</button>
        </div>
    </form>

</div>
